name: Validate multilingual SEO
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate 3-language HTML and sitemap
        run: python scripts/check_multilingual_seo.py
